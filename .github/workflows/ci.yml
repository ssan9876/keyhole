name: CI

on: [push, pull_request]

# Nothing here writes to the repository. The release workflow is the only one
# that needs contents: write, and it asks for it there.
permissions:
  contents: read

# Stated rather than inherited, matching release.yml: GitHub's default Linux
# shell is `bash -e {0}`, and every `run:` here is written expecting bash.
defaults:
  run:
    shell: bash

# A push to a branch that already has a run in flight supersedes it. Push and
# pull_request runs land in different groups (github.ref is refs/heads/<branch>
# for one and refs/pull/<n>/merge for the other), so neither cancels the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - run: go vet ./...

      - name: gofmt
        # gofmt -l prints the offending files and exits 0, so its exit code is
        # useless as a gate — the output is the signal, and test -z is what
        # turns that output into an exit status. The bare gofmt -l on the first
        # line exists only so the log names the files when the gate fails;
        # test -z swallows them.
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version is required: the root package.json has no "packageManager"
      # field, and without either one this action fails before it installs
      # anything. Pinned to the major the pnpm-lock.yaml lockfileVersion (9.0)
      # belongs to rather than an exact patch, because a lockfile format change
      # is a major-version event.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # setup-node must come after pnpm: `cache: pnpm` shells out to pnpm to
      # locate the store directory.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @keyhole/web lint
      - run: pnpm -r test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on the ubuntu-latest runner image.
      - run: shellcheck scripts/install.sh

      # shellcheck lints; bash -n is the parser's own opinion, and the two
      # disagree often enough to be worth asking both.
      - run: bash -n scripts/install.sh

      # The installer cannot be run for real anywhere but a Proxmox host, so
      # --dry-run is the seam: install_test.sh diffs the printed plan against
      # recorded goldens, asserts the signature is verified before the checksum
      # is trusted, and asserts the Cloudflare token never reaches the plan.
      # None of that needs pct, so it runs on a plain runner.
      - run: bash scripts/install_test.sh

  # Deliberately its own job rather than more steps on `web`: this one compiles
  # a Go binary, boots a real server against a real SQLite database, installs a
  # browser, and drives Argon2id derivations at 64 MiB through it. Folding it
  # into `web` would put a two-minute unit-test signal behind a ten-minute one.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # e2e/server.ts builds and runs cmd/keyhole itself, so this job needs Go
      # as much as the `go` job does.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run from apps/web: @playwright/test is a devDependency of that workspace
      # only, so `pnpm exec playwright` does not resolve from the repository
      # root. --with-deps installs the system libraries headless Chromium needs
      # on the runner image.
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts sets reuseExistingServer: !process.env.CI, and
      # GitHub sets CI=true, so the Vite dev server is started fresh here.
      - name: End-to-end journeys
        working-directory: apps/web
        run: pnpm test:e2e

      # trace: "retain-on-failure" only helps if the trace leaves the runner.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

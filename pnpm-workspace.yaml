packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  "@playwright/test": true
# @vitest/mocker's peer range (^5 || ^6 || ^7) otherwise lets pnpm install a
# second, newer vite alongside the one apps/web depends on directly, and the
# two copies' Plugin types are incompatible under exactOptionalPropertyTypes.
overrides:
  vite: "^6.3.0"
